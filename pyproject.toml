[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gwmsmon"
version = "0.1.0"
description = "Monitoring service for CMS HTCondor global pool"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "flask",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest",
    "ruff",
]

[project.scripts]
gwmsmon-collect = "gwmsmon.collector:main"
gwmsmon-web = "gwmsmon.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg (flask uses this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
